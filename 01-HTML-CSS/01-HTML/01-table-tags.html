<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOD MENU</title>
</head>

<body>
    <table border="black">
        <caption>Food menu</caption>
        <tr>
            <th>Items</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Samosa</td>
            <td>12</td>
        </tr>
        <tr>
            <td>Frooti</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Chips</td>
            <td>20</td>
        </tr>
    </table>
</body>

<hr>
<!-- Using Attribute colspan and rowspan -->
<table border="black">
    <caption>Food Menu</caption>
    <tr>
        <th rowspan="2">Items</th>
        <th colspan="2">Price</th>
    </tr>
    <tr>
        <th>INR</th>
        <th>USD</th>
    </tr>
    <tr>
        <td>Frooti</td>
        <td>10</td>
        <td>0.14</td>
    </tr>
    <tr>
        <td>Samosa</td>
        <td>12</td>
        <td>0.17</td>
    </tr>
</table>

<hr>

</html>
